services:
  - type: web
    name: motor-tributario
    runtime: docker
    plan: free
    healthCheckPath: /api/v4/health
    envVars:
      - key: APP_ENV
        value: production
      - key: REQUIRE_AUTH
        value: "true"
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: motor-tributario-db
          property: connectionString
databases:
  - name: motor-tributario-db
    plan: free
